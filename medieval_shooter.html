<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relics of the Ember King</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5play/3.26.5/planck.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5play/3.26.5/p5play.js"></script>
    <style>
      :root {
        color-scheme: dark;
        --ink: #e8e2d3;
        --muted: #a7afa7;
        --gold: #efbd58;
        --panel: #18272a;
        --edge: #52615a;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 24px 16px 36px;
        background: #10191c;
        color: var(--ink);
        font-family: Georgia, "Times New Roman", serif;
      }

      main { width: min(100%, 1000px); margin: 0 auto; }

      .topline {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 12px;
        font: 14px/1.4 monospace;
      }

      .topline a { color: var(--gold); text-decoration: none; }
      .topline a:hover { text-decoration: underline; }

      h1 {
        margin: 0;
        color: var(--gold);
        font-size: clamp(24px, 5vw, 38px);
        font-weight: 700;
      }

      .subtitle { margin: 6px 0 16px; color: var(--muted); }

      .game-frame {
        overflow: hidden;
        border: 1px solid var(--edge);
        background: #10191c;
        box-shadow: 0 14px 40px #0007;
      }

      canvas {
        display: block;
        width: 100% !important;
        height: auto !important;
        aspect-ratio: 16 / 9;
        touch-action: none;
      }

      .instructions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 20px;
        padding: 12px 14px;
        border-top: 1px solid var(--edge);
        background: var(--panel);
        color: var(--muted);
        font: 12px/1.5 monospace;
      }

      .instructions strong { color: var(--ink); font-weight: 600; }

      #touchControls {
        display: none;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 8px;
        margin-top: 12px;
      }

      .touch-button {
        min-height: 48px;
        border: 1px solid var(--edge);
        border-radius: 4px;
        background: var(--panel);
        color: var(--ink);
        font: 600 14px monospace;
        touch-action: none;
        user-select: none;
      }

      .touch-button:active, .touch-button.selected {
        border-color: var(--gold);
        background: #384135;
      }

      .weapon-buttons { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }

      @media (max-width: 700px) {
        body { padding: 14px 10px 24px; }
        #touchControls { display: grid; }
      }
    </style>
  </head>
  <body>
    <main>
      <nav class="topline"><a href="index.html">&larr; Home</a><span>AN EMBERBOUND QUEST</span></nav>
      <h1>Relics of the Ember King</h1>
      <p class="subtitle">Break through the cursed ranks. End the king's reign.</p>
      <section class="game-frame" aria-label="Relics of the Ember King game">
        <div id="gameCanvas"></div>
        <div class="instructions">
          <span><strong>A / D</strong> move</span>
          <span><strong>Space</strong> jump</span>
          <span><strong>Left click</strong> fire</span>
          <span><strong>1 / 2 / 3</strong> switch weapon</span>
          <span><strong>E</strong> shield</span>
          <span><strong>Enter</strong> start or restart</span>
        </div>
      </section>
      <div id="touchControls" aria-label="Touch game controls">
        <button class="touch-button" data-action="left" aria-label="Move left">LEFT</button>
        <button class="touch-button" data-action="right" aria-label="Move right">RIGHT</button>
        <button class="touch-button" data-action="jump" aria-label="Jump">JUMP</button>
        <button class="touch-button" data-action="fire" aria-label="Fire weapon">FIRE</button>
        <button class="touch-button" data-action="shield" aria-label="Activate shield">SHIELD</button>
        <div class="weapon-buttons">
          <button class="touch-button" data-weapon="0">1 · BOLT</button>
          <button class="touch-button" data-weapon="1">2 · REPEATER</button>
          <button class="touch-button" data-weapon="2">3 · DRAGONFIRE</button>
        </div>
      </div>
    </main>
    <script src="medieval_shooter.js"></script>
  </body>
</html>
